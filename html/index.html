<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopařův průvodce po LLMs</title>
<meta name="description" content="AI Monday 5. 10. 2026: co je uvnitř LLM, proč halucinuje a kam patří vedle klasického softwaru.">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewport" aria-live="polite"><div class="deck"></div></main>
  <nav class="expedition" aria-label="Historická osa přednášky">
    <div class="era-stops"></div>
    <div class="scrubber"><span class="era-caption">Na začátku výpravy</span><input id="slide-position" type="range" min="1" value="1" aria-label="Pozice v přednášce"><span class="build-steps" role="img" aria-label="Kroky slidu"></span><span class="counter" aria-hidden="true"></span></div>
  </nav>
  <div class="help">←/→ nebo mezerník: další krok · F: celá obrazovka · N: poznámky · O: přehled · P: tisk (Shift+P s poznámkami) · T: reset časovače</div>
  <aside class="notes" aria-label="Poznámky řečníka"></aside>
  <noscript><p style="padding:40px;font:20px sans-serif">Prezentace potřebuje JavaScript.</p></noscript>
  <script src="qr.js"></script>
  <script src="notes.js"></script>
  <script src="doodles.js"></script>
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
