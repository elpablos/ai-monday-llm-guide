name: Deploy presentation to GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: |
          for file in html/*.js; do node --check "$file"; done
      - name: Package presentation
        run: python3 scripts/package-pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
